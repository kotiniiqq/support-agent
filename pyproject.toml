[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-agent"
version = "0.1.0"
description = "A support agent that answers only from its knowledge base, hands sensitive tickets to a person, and measures both."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kyrylo Kalashnyk" }]
dependencies = ["httpx>=0.27", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29", "qdrant-client>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
support-agent = "support_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# third-party: starlette warns about its own httpx-based TestClient
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
